<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Impact in Numbers</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #333;
  }

  .impact-section {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }



  .impact-wrapper {
    padding: 50px 20px 60px;
    background: #ffffff;
  }

  .metrics-row {
    display: flex;
    justify-content: center;
    align-items: stretch;
    flex-wrap: nowrap;
    gap: 24px;
  }

  .metric-item {
    text-align: center;
    flex: 1 1 0;
    position: relative;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    background: #ffffff;
    border: 1.5px solid #e0e4ea;
    border-radius: 10px;
    padding: 28px 18px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .metric-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .metric-item:nth-child(1) { transition-delay: 0.0s; }
  .metric-item:nth-child(2) { transition-delay: 0.1s; }
  .metric-item:nth-child(3) { transition-delay: 0.2s; }

  .metric-label-top {
    font-size: 18px;
    font-weight: 600;
    color: #000000;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    min-height: 1.2em;
  }

  .metric-number {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.2rem, 4.5vw, 3rem);
    font-weight: 700;
    color: #000000;
    line-height: 1.1;
  }

  .metric-suffix {
    font-size: 0.65em;
  }

  .metric-label-bottom {
    font-family: 'Open Sans', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #000000;
    margin-top: 8px;
    line-height: 1.4;
    max-width: 200px;
    margin-left: auto;
    margin-right: auto;
  }

  @media (max-width: 600px) {
    .metrics-row {
      flex-wrap: wrap;
    }
    .metric-item {
      flex: 0 0 100%;
    }
    .impact-wrapper {
      padding: 36px 12px 44px;
    }
  }
</style>
</head>
<body>

<div class="impact-section">
  <div class="impact-wrapper">

    <div class="metrics-row">
      <div class="metric-item" data-target="100">
        <div class="metric-label-top">Supported</div>
        <div class="metric-number">
          <span class="counter">0</span><span class="metric-suffix">+</span>
        </div>
        <div class="metric-label-bottom">Nonprofits across India, US &amp; UK</div>
      </div>

      <div class="metric-item" data-target="150">
        <div class="metric-label-top">Worked On</div>
        <div class="metric-number">
          <span class="counter">0</span><span class="metric-suffix">+</span>
        </div>
        <div class="metric-label-bottom">MIS, CRM &amp; AI projects delivered</div>
      </div>

      <div class="metric-item" data-target="5">
        <div class="metric-label-top">Established</div>
        <div class="metric-number">
          <span class="counter">0</span><span class="metric-suffix">+</span>
        </div>
        <div class="metric-label-bottom">Years of experience in nonprofit tech</div>
      </div>
    </div>
  </div>
</div>

<script>
  function formatNumber(num) {
    return num.toLocaleString('en-IN');
  }

  function animateCounter(el, target, duration) {
    const start = performance.now();
    const step = (now) => {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 4);
      const current = Math.floor(eased * target);
      el.textContent = formatNumber(current);
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        el.textContent = formatNumber(target);
      }
    };
    requestAnimationFrame(step);
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        const item = entry.target;
        item.classList.add('visible');

        const counter = item.querySelector('.counter');
        const target = parseInt(item.dataset.target, 10);
        const duration = target > 10000 ? 2200 : 1600;

        setTimeout(() => animateCounter(counter, target, duration), 200);
        observer.unobserve(item);
      }
    });
  }, { threshold: 0.3 });

  document.querySelectorAll('.metric-item').forEach((item) => observer.observe(item));
</script>

</body>
</html>
